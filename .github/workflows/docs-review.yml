name: Documentation review

on:
  push:
    branches: [docs/developer-first-site]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Export reproducible offline review inputs
        run: |
          git archive --format=tar.gz HEAD -o /tmp/panefold-source.tar.gz
          mkdir -p review-tools
          cp -R "$(dirname "$(dirname "$(readlink -f "$(command -v pnpm)")")")" review-tools/pnpm
          find . -name node_modules -prune -print0 > /tmp/dependency-paths
          printf 'review-tools\0' >> /tmp/dependency-paths
          tar --null -T /tmp/dependency-paths -czf /tmp/panefold-tooling.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: docs-review-source
          path: /tmp/panefold-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: docs-review-tooling
          path: /tmp/panefold-tooling.tar.gz
          if-no-files-found: error
          retention-days: 1
