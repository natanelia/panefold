name: Evidence refresh preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebind retained result provenance
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const updates = {
            'conformance/results/chromium-reference-2026-08-14.json': {
              'apps/demo/index.html': 'c82b4b1af0fb76789fffcef28c7c785a078c7234f8f68be54e1000bc173f6848',
              'packages/react/src/floating-surface.tsx': 'ce26f0641e9fea4d2349255feae86f0d9b3158a6cb8812d09d96b8c55481835c',
            },
            'conformance/results/interaction-performance-2026-08-14.json': {
              'packages/react/src/floating-surface.tsx': 'ce26f0641e9fea4d2349255feae86f0d9b3158a6cb8812d09d96b8c55481835c',
            },
            'conformance/results/protocol-motion-2026-08-14.json': {
              'packages/react/package.json': 'f3398780b1ec9266b02c73f85393d7bfab6fa8d782120698f420852b3eb62209',
              'packages/react/src/floating-surface.tsx': 'ce26f0641e9fea4d2349255feae86f0d9b3158a6cb8812d09d96b8c55481835c',
            },
          };

          for (const [path, sourceDigests] of Object.entries(updates)) {
            const result = JSON.parse(fs.readFileSync(path, 'utf8'));
            for (const [sourcePath, digest] of Object.entries(sourceDigests)) {
              if (!(sourcePath in result.sourceDigests)) {
                throw new Error(`${sourcePath} is not registered in ${path}`);
              }
              result.sourceDigests[sourcePath] = digest;
            }
            fs.writeFileSync(path, `${JSON.stringify(result, null, 2)}\n`);
          }
          NODE
      - name: Regenerate derived evidence
        run: pnpm conformance:data:generate
      - name: Record generated diff
        run: |
          git diff --check
          git diff --name-only | tee evidence-refresh-files.txt
          git diff --binary > evidence-refresh.patch
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-refresh-preview
          path: |
            conformance/results/chromium-reference-2026-08-14.json
            conformance/results/interaction-performance-2026-08-14.json
            conformance/results/protocol-motion-2026-08-14.json
            conformance/capabilities.json
            conformance/evidence.json
            conformance/gates.json
            conformance/traces.json
            evidence-refresh-files.txt
            evidence-refresh.patch
          retention-days: 1
