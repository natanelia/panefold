name: Validate PR preview deployment

on:
  push:
    branches: [ci/pull-request-previews]
    paths: [.github/workflows/preview-bootstrap.yml]

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/pages.yml
  smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check the published PR 33 demo
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { chromium } from '@playwright/test';
          const base = 'https://natanelia.github.io/panefold/';
          let manifest;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(`${base}previews/pr-33/preview.json?check=${Date.now()}`);
            if (response.ok) {
              manifest = await response.json();
              if (manifest.sha === 'bd2a43d80a8fd036414bf42d511295d8d3906ca0' && manifest.status === 'ready') break;
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          assert.equal(manifest?.sha, 'bd2a43d80a8fd036414bf42d511295d8d3906ca0');
          assert.equal(manifest?.status, 'ready');
          assert.equal((await fetch(`${base}workbench/`)).status, 200);
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          await page.goto(`${base}previews/pr-33/workbench/`);
          const tab = page.locator('[data-workspace-panel-tab="notes"]');
          await tab.waitFor({ state: 'visible' });
          const target = page.locator('[data-workspace-group="inspector"]');
          const sourceBox = await tab.boundingBox();
          const targetBox = await target.boundingBox();
          assert.ok(sourceBox && targetBox);
          await page.mouse.move(sourceBox.x + sourceBox.width / 2, sourceBox.y + sourceBox.height / 2);
          await page.mouse.down();
          await page.mouse.move(targetBox.x + targetBox.width - 6, targetBox.y + targetBox.height / 2, { steps: 10 });
          const overlay = page.locator('[data-workspace-panel-drag]');
          await overlay.waitFor({ state: 'visible' });
          assert.equal(await overlay.getAttribute('data-workspace-drop-kind'), 'edge');
          assert.equal(await overlay.locator('.pf-panel-drop-preview').evaluate(el => getComputedStyle(el).borderRadius), '0px');
          await mkdir('artifacts', { recursive: true });
          await page.screenshot({ path: 'artifacts/pr-33-live-preview.png' });
          await page.keyboard.press('Escape');
          await page.mouse.up();
          assert.deepEqual(errors, []);
          await writeFile('artifacts/live-preview-check.json', JSON.stringify({ manifest, mainStatus: 200, dragPreview: 'edge', borderRadius: '0px', pageErrors: errors }, null, 2));
          await browser.close();
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-preview-check
          path: artifacts
          retention-days: 7
