name: Refresh PR 14 evidence

on:
  push:
    branches:
      - agent/hide-single-tab-row-and-popup-styles

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hide-single-tab-row-and-popup-styles
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove this one-shot workflow from the resulting commit
        run: rm .github/workflows/pr14-refresh.yml
      - name: Refresh recorded source digests
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";

          const resultSources = new Map([
            [
              "conformance/results/chromium-reference-2026-08-14.json",
              ["apps/demo/index.html", "packages/react/src/floating-surface.tsx"],
            ],
            [
              "conformance/results/interaction-performance-2026-08-14.json",
              ["packages/react/src/floating-surface.tsx"],
            ],
            [
              "conformance/results/protocol-motion-2026-08-14.json",
              ["packages/react/package.json"],
            ],
          ]);

          for (const [resultPath, sourcePaths] of resultSources) {
            const result = JSON.parse(await readFile(resultPath, "utf8"));
            for (const sourcePath of sourcePaths) {
              const source = await readFile(sourcePath);
              result.sourceDigests[sourcePath] = createHash("sha256").update(source).digest("hex");
            }
            await writeFile(resultPath, `${JSON.stringify(result, null, 2)}\n`);
          }
          NODE
          pnpm exec oxfmt --write \
            conformance/results/chromium-reference-2026-08-14.json \
            conformance/results/interaction-performance-2026-08-14.json \
            conformance/results/protocol-motion-2026-08-14.json
          pnpm conformance:data:generate
      - name: Stage generated conformance state for drift checks
        run: |
          git add \
            .github/workflows/pr14-refresh.yml \
            conformance
      - name: Verify the complete repository gate
        run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture PR screenshots
        run: |
          mkdir -p docs/pr-assets
          cat > e2e/pr14-capture.spec.ts <<'SPEC'
          import { expect, test } from "@playwright/test";

          test.use({
            colorScheme: "dark",
            viewport: { width: 1440, height: 900 },
          });

          test("captures a docked single-tab container without a visible tab row", async ({ page }) => {
            await page.emulateMedia({ reducedMotion: "reduce" });
            await page.goto("/");

            const workspaceTab = page.getByRole("tab", { name: "workspace.ts" });
            await workspaceTab.click();
            await workspaceTab.locator('[data-workspace-tab-close="notes"]').click();

            const primaryGroup = page.locator('[data-workspace-group="primary"]');
            await expect(
              primaryGroup.locator('[data-workspace-panel-tab="map-canvas"]'),
            ).toHaveCSS("opacity", "0");
            await page.screenshot({
              path: "docs/pr-assets/pr-14-single-tab-container.png",
              fullPage: true,
            });
          });

          test("captures a compact single-panel floating surface", async ({ page }) => {
            await page.emulateMedia({ reducedMotion: "reduce" });
            await page.goto("/");

            await page.getByRole("tab", { name: "workspace.ts" }).click();
            await page.getByRole("button", { name: "Actions for workspace.ts" }).click();
            await page.getByRole("menuitem", { name: "Float workspace.ts" }).click();

            const frame = page.locator('[data-workspace-floating-surface^="floating:notes:"]');
            await expect(frame).toBeVisible();
            await expect(frame.locator('[data-workspace-panel-tab="notes"]')).toHaveCSS(
              "opacity",
              "0",
            );
            await page.screenshot({
              path: "docs/pr-assets/pr-14-floating-single-tab.png",
              fullPage: true,
            });
          });

          test("captures the consistently styled detached browser window", async ({ page }) => {
            await page.goto("/");
            await page.getByRole("tab", { name: "workspace.ts" }).click();
            await page.getByRole("button", { name: "Actions for workspace.ts" }).click();

            const popupPromise = page.waitForEvent("popup");
            await page.getByRole("menuitem", { name: "Open in new window" }).click();
            const popup = await popupPromise;
            await expect(popup.locator(".demo-external-header")).toBeVisible();
            await popup.screenshot({
              path: "docs/pr-assets/pr-14-detached-window.png",
              fullPage: true,
            });
          });
          SPEC
          pnpm exec playwright test e2e/pr14-capture.spec.ts --project=chromium --workers=1
          rm e2e/pr14-capture.spec.ts
      - name: Commit generated evidence and screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/pr14-refresh.yml \
            conformance \
            docs/pr-assets
          git commit -m "Refresh conformance evidence and add PR screenshots"
          git push origin HEAD:agent/hide-single-tab-row-and-popup-styles
