name: Deploy website

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed, ready_for_review, converted_to_draft]
  workflow_dispatch:
  workflow_call:

# PR code is built only in the read-only preview job, on a fresh runner.
permissions:
  contents: read

# Serialize the complete site assembly, including production and all open previews.
# Never cancel a Pages deployment already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      main: ${{ steps.plan.outputs.main }}
      has-previews: ${{ steps.plan.outputs.has-previews }}
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test scripts/pages-previews.test.mjs
      - uses: actions/github-script@v8
        id: plan
        with:
          script: |
            const { createPlan } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pages-previews.mjs`);
            await createPlan({ github, context, core });

  production:
    needs: plan
    outputs:
      artifact-id: ${{ steps.production.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.main }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
      - uses: actions/upload-artifact@v7
        id: production
        with:
          name: site-production
          path: apps/site/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  previews:
    needs: plan
    if: needs.plan.outputs.has-previews == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A broken PR must not prevent production or other previews from publishing.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Do not let PR installs populate a cache used by trusted jobs.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build the PR workbench at its own URL
        env:
          PR_NUMBER: ${{ matrix.number }}
        run: |
          pnpm --filter '@panefold/demo^...' run build
          export PANEFOLD_DEMO_BASE="/${GITHUB_REPOSITORY#*/}/previews/pr-${PR_NUMBER}/workbench/"
          pnpm --filter @panefold/demo run build
      - uses: actions/upload-artifact@v7
        with:
          name: site-pr-${{ matrix.number }}
          path: apps/demo/dist
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: [plan, production, previews]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.production.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.assemble.outputs.deploy }}
      manifest: ${{ steps.assemble.outputs.manifest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: tools
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.production.outputs.artifact-id }}
          path: incoming/site-production
          merge-multiple: true
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.has-previews == 'true'
        with:
          pattern: site-pr-*
          path: incoming
      - uses: actions/github-script@v8
        id: assemble
        env:
          PREVIEW_PLAN: ${{ needs.plan.outputs.plan }}
        with:
          script: |
            const { prepareDeployment } = await import(`${process.env.GITHUB_WORKSPACE}/tools/scripts/pages-previews.mjs`);
            await prepareDeployment({ github, context, core, plan: JSON.parse(process.env.PREVIEW_PLAN), incoming: 'incoming', output: 'published' });
      - uses: actions/upload-pages-artifact@v5
        if: steps.assemble.outputs.deploy == 'true'
        with:
          path: published
          include-hidden-files: true

  deploy:
    needs: [plan, assemble]
    if: always() && !cancelled() && needs.assemble.result == 'success' && needs.assemble.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the complete site
        id: deployment
        uses: actions/deploy-pages@v5

  links:
    needs: [assemble, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          PREVIEW_MANIFEST: ${{ needs.assemble.outputs.manifest }}
          SITE_URL: ${{ needs.deploy.outputs.url }}
        with:
          script: |
            const { publishComments } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pages-previews.mjs`);
            await publishComments({ github, context, core, manifest: JSON.parse(process.env.PREVIEW_MANIFEST), siteUrl: process.env.SITE_URL });
