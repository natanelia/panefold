name: Deploy website

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Environment rules use the run ref, not the source checked out by a job.
    # PR validation uses pages-build.yml directly and never enters github-pages.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pages-build.yml

  deploy:
    needs: build
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: published
          merge-multiple: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: published
          include-hidden-files: true
      - name: Deploy the complete site
        id: deployment
        uses: actions/deploy-pages@v5

  links:
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          PREVIEW_MANIFEST: ${{ needs.build.outputs.manifest }}
          SITE_URL: ${{ needs.deploy.outputs.url }}
        with:
          script: |
            const { publishComments } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pages-previews.mjs`);
            await publishComments({ github, context, core, manifest: JSON.parse(process.env.PREVIEW_MANIFEST), siteUrl: process.env.SITE_URL });
