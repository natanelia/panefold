name: Temporary keyboard resize evidence refresh

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/keyboard-resize-evidence.yml"
      - "packages/react/src/WorkspaceSurface.tsx"
      - "packages/react/test/WorkspaceSurface.test.tsx"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/solver-bounded-keyboard-resize'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITEST_MAX_WORKERS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check whether evidence is already recorded
        id: guard
        run: |
          if git log -1 --format=%s | grep -q '^test: record verified keyboard resize evidence$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.skip != 'true'
      - name: Apply canonical formatting
        if: steps.guard.outputs.skip != 'true'
        run: pnpm exec oxfmt --write packages/react/src/WorkspaceSurface.tsx packages/react/test/WorkspaceSurface.test.tsx
      - name: Build and execute unit tests
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p artifacts
          pnpm build:packages
          pnpm exec vitest run --reporter=json --outputFile=artifacts/preview-unit.json
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.guard.outputs.skip != 'true'
      - name: Execute complete reference browser tests
        if: steps.guard.outputs.skip != 'true'
        run: pnpm exec playwright test --workers=2 --retries=0 --reporter=json > artifacts/preview-browser.json
      - name: Capture fresh source-bound results
        if: steps.guard.outputs.skip != 'true'
        run: |
          pnpm performance:smoke > artifacts/preview-node-smoke.json
          node scripts/record-preview-evidence.mjs
          pnpm exec oxfmt --write conformance/results docs/CONFORMANCE.md
          pnpm conformance:data:generate
          # The conformance check requires recorded evidence to be committed.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/react/src/WorkspaceSurface.tsx packages/react/test/WorkspaceSurface.test.tsx conformance/results conformance/evidence.json docs/CONFORMANCE.md
          git commit -m "test: record verified keyboard resize evidence"
          pnpm check
      - name: Publish verified results back to the feature branch
        if: steps.guard.outputs.skip != 'true'
        run: git push origin HEAD:refs/heads/fix/solver-bounded-keyboard-resize
