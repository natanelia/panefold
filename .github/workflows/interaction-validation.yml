name: Verify final drag interaction refinements

on:
  push:
    branches: [fix/vscode-drag-interaction-parity]
    paths: [.github/workflows/interaction-validation.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_WORKERS: "1"
    outputs:
      sha: ${{ steps.bundle.outputs.sha }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply checked focus and recording refinements
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          encoded = ''
          data = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == 'f79aad6f3289965cc87c5ec33686c11d982e4c16c44641154749213a77f1eab4'
          pathlib.Path('/tmp/review.patch').write_bytes(data)
          PY
          git apply /tmp/review.patch
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:packages
      - name: Execute all unit and Chromium tests
        run: |
          mkdir -p artifacts
          pnpm exec vitest run --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile=artifacts/preview-unit.json
          pnpm exec playwright test --retries=0 --reporter=json > artifacts/preview-browser.json
          node scripts/performance-smoke.mjs > artifacts/preview-node-smoke.json
      - name: Refresh evidence from this execution
        run: |
          node scripts/record-preview-evidence.mjs
          pnpm exec oxfmt --write conformance/results/*-2026-09-26.json docs/CONFORMANCE.md .github/workflows/interaction-validation.yml
          node scripts/generate-conformance-data.mjs
          git add conformance docs packages/react/src/WorkspaceSurface.tsx packages/react/test/WorkspaceSurface.test.tsx scripts/capture-drag-comparison.mjs .github/workflows/interaction-validation.yml
      - name: Run remaining check components and demo checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm security:check
          pnpm publication:check
          pnpm requirements:check
          pnpm conformance:data:check
          pnpm protocol:coverage:check
          pnpm docs:claims:check
          pnpm conformance:check
          pnpm performance:smoke
          pnpm exec tsc --noEmit -p tsconfig.json
          pnpm build:site
          pnpm --filter @panefold/demo test
          pnpm test:site:e2e
      - name: Verify occupied preview ports fail instead of falling back
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createServer } from 'node:net';
          import { spawn } from 'node:child_process';
          import { once } from 'node:events';
          const blocker = createServer();
          blocker.listen(4317, '127.0.0.1');
          await once(blocker, 'listening');
          const child = spawn('pnpm', ['--filter', '@panefold/demo', 'preview', '--host', '127.0.0.1', '--port', '4317', '--strictPort'], { stdio: ['ignore', 'pipe', 'pipe'] });
          let output = '';
          child.stdout.on('data', chunk => { output += chunk; });
          child.stderr.on('data', chunk => { output += chunk; });
          const timeout = setTimeout(() => child.kill('SIGTERM'), 15000);
          try {
            const [code, signal] = await once(child, 'exit');
            assert.equal(signal, null, 'Preview must exit by itself');
            assert.notEqual(code, 0);
            assert.match(output, /already in use/);
            console.log('Occupied-port rejection passed');
          } finally {
            clearTimeout(timeout);
            blocker.close();
          }
          JS
      - name: Package verified review fixes and evidence
        id: bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conformance docs packages/react/src/WorkspaceSurface.tsx packages/react/test/WorkspaceSurface.test.tsx scripts/capture-drag-comparison.mjs .github/workflows/interaction-validation.yml
          git commit -m 'fix(react): retain tab focus after final group merge and harden recording ports'
          git branch reviewed-interactions
          git bundle create /tmp/reviewed.bundle "$SOURCE_SHA"..reviewed-interactions
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: reviewed-bundle
          path: /tmp/reviewed.bundle
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-executed-evidence
          path: |
            artifacts
            test-results
            conformance/results/*-2026-09-26.json
          retention-days: 30
          if-no-files-found: warn

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact }}
          path: /tmp/reviewed
          merge-multiple: true
      - name: Fast-forward the requested feature branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          git -c core.hooksPath=/dev/null fetch /tmp/reviewed/reviewed.bundle refs/heads/reviewed-interactions
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin FETCH_HEAD:refs/heads/fix/vscode-drag-interaction-parity
