name: Publish and verify drag interaction comparison

on:
  push:
    branches: [fix/vscode-drag-interaction-parity]
    paths: [.github/workflows/interaction-validation.yml]

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.bundle.outputs.sha }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: 10880356519
          run-id: 36171610299
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/recorded
          merge-multiple: true
      - name: Preserve verified recordings and use safe DOM fixture construction
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root = pathlib.Path('/tmp/recorded/docs/media')
          provenance = json.loads((root / 'vscode-drag-provenance.json').read_text())
          assert provenance['refs']['before'] == '877be5f4ee9aae5f76e0a72e2b05b3725b4eacbc'
          assert provenance['refs']['after'] == '39e791076790b1650d4029035396b3b7ba3971bd'
          subprocess.run(['git', 'diff', '--exit-code', provenance['refs']['after'], 'HEAD', '--', 'packages', 'apps'], check=True)
          expected = {'vscode-drag-before.gif': '559896ee97f91408781e0935154bd2cd01a0ca2fd88eabf60f29c40a682ce111', 'vscode-drag-after.gif': '2c086ba40b74dc01cb8eba01a935ffd1dc41af34bc856ccf1b1b75426b815a58'}
          for name, sha in expected.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == sha
          destination = pathlib.Path('docs/media')
          destination.mkdir(exist_ok=True)
          for name in [*expected, 'vscode-drag-provenance.json', 'vscode-drag-before-tabs.png', 'vscode-drag-after-tabs.png', 'vscode-drag-before-group.png', 'vscode-drag-after-group.png']:
              shutil.copyfile(root / name, destination / name)
          path = pathlib.Path('packages/react/test/tab-insertion.test.ts')
          text = path.read_text()
          start = text.index('  root.innerHTML =')
          end = text.index('  const vertical = ', start)
          replacement = '''  const group = document.createElement("section");
            group.dataset.workspaceGroup = "right";
            group.dataset.tabOrientation = mode === "vertical" ? "vertical" : "horizontal";
            group.setAttribute("aria-labelledby", "right-title");
            const strip = document.createElement("div");
            strip.setAttribute("role", "tablist");
            strip.setAttribute("aria-labelledby", "right-title");
            const b = document.createElement("button");
            b.dataset.workspacePanelTab = "b";
            const c = document.createElement("button");
            c.dataset.workspacePanelTab = "c";
            strip.append(b, c);
            group.append(strip);
            root.append(group);
            document.body.append(root);
          '''
          replacement = replacement.replace('\n  ', '\n')
          path.write_text(text[:start] + replacement.rstrip() + '\n' + text[end:])
          PY
      - name: Package media and fixture commit
        id: bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media packages/react/test/tab-insertion.test.ts
          git commit -m 'test: attach real before-after GIFs and construct fixtures without HTML sinks'
          git branch prepared-media
          git bundle create /tmp/media.bundle "$SOURCE_SHA"..prepared-media
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: media-bundle
          path: /tmp/media.bundle
          retention-days: 2
          if-no-files-found: error

  publish-media:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: /tmp/media
          merge-multiple: true
      - name: Fast-forward the requested feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git -c core.hooksPath=/dev/null fetch /tmp/media/media.bundle refs/heads/prepared-media
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin FETCH_HEAD:refs/heads/fix/vscode-drag-interaction-parity

  validate:
    needs: [prepare, publish-media]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITEST_MAX_WORKERS: "1"
    outputs:
      sha: ${{ steps.bundle.outputs.sha }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Format the test fixture and capture script
        run: pnpm exec oxfmt --write packages/react/test/tab-insertion.test.ts scripts/capture-drag-comparison.mjs .github/workflows/interaction-validation.yml
      - run: pnpm build:packages
      - name: Execute the full unit and browser suites
        run: |
          mkdir -p artifacts
          pnpm exec vitest run --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile=artifacts/preview-unit.json
          pnpm exec playwright test --retries=0 --reporter=json > artifacts/preview-browser.json
          node scripts/performance-smoke.mjs > artifacts/preview-node-smoke.json
      - name: Generate source-bound evidence only from this execution
        run: |
          node scripts/record-preview-evidence.mjs
          pnpm exec oxfmt --write conformance/results/*-2026-09-26.json docs/CONFORMANCE.md
          node scripts/generate-conformance-data.mjs
          git add conformance docs scripts/capture-drag-comparison.mjs packages/react/test/tab-insertion.test.ts .github/workflows/interaction-validation.yml
      - name: Full repository and demo checks
        id: check
        continue-on-error: true
        run: |
          pnpm check
          pnpm --filter @panefold/demo test
          pnpm test:site:e2e
      - name: Package executed evidence regardless of broader check outcome
        id: bundle
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conformance docs scripts/capture-drag-comparison.mjs packages/react/test/tab-insertion.test.ts .github/workflows/interaction-validation.yml
          git commit -m 'test: retain executed unit and browser evidence for drag parity'
          git branch verified-evidence
          git bundle create /tmp/evidence.bundle "$SOURCE_SHA"..verified-evidence
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: evidence-bundle
          path: /tmp/evidence.bundle
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-executed-evidence
          path: |
            artifacts
            test-results
            conformance/results/*-2026-09-26.json
          retention-days: 30
          if-no-files-found: warn
      - name: Report broader check failure honestly
        if: steps.check.outcome == 'failure'
        run: exit 1

  publish-evidence:
    needs: validate
    if: always() && needs.validate.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vscode-drag-interaction-parity
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact }}
          path: /tmp/evidence
          merge-multiple: true
      - name: Fast-forward only the requested feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          git -c core.hooksPath=/dev/null fetch /tmp/evidence/evidence.bundle refs/heads/verified-evidence
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin FETCH_HEAD:refs/heads/fix/vscode-drag-interaction-parity
