name: Linked context validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'feat/linked-panel-context'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_WORKERS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture canonical formatting
        run: |
          mkdir -p artifacts
          pnpm exec oxfmt --write apps/demo/src/linked-panels.tsx docs/guides/panels.md
          git diff -- apps/demo/src/linked-panels.tsx docs/guides/panels.md > artifacts/format.patch
          cat artifacts/format.patch
      - run: pnpm build:packages
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm exec vitest run packages/ecosystem/test/panel-context.test.ts packages/react/test/panel-context.test.tsx
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/linked-panels.spec.ts
      - name: Preserve focused validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linked-context-validation
          path: |
            artifacts
            test-results
          if-no-files-found: warn
          retention-days: 7
