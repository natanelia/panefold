name: Format preview

on:
  push:
    branches:
      - agent/hide-single-tab-row-and-popup-styles

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted files
        run: |
          pnpm exec prettier --write e2e/single-tab-row.spec.ts packages/react/src/hide-single-tab-row.css
          printf '\n===== e2e/single-tab-row.spec.ts =====\n'
          cat e2e/single-tab-row.spec.ts
          printf '\n===== packages/react/src/hide-single-tab-row.css =====\n'
          cat packages/react/src/hide-single-tab-row.css
