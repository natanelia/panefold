name: Format preview

on:
  push:
    branches:
      - agent/hide-single-tab-row-and-popup-styles

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted file
        run: |
          pnpm exec prettier --write apps/demo/src/workbench.css
          printf '\n===== apps/demo/src/workbench.css =====\n'
          cat apps/demo/src/workbench.css
