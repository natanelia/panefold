name: Format preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format hidden-tab stylesheet
        run: pnpm exec oxfmt --write packages/react/src/hide-single-tab-row.css
      - name: Print formatted stylesheet
        run: cat packages/react/src/hide-single-tab-row.css
