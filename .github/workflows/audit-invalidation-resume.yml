name: Verify invalidation optimization

on:
  push:
    branches: [perf/audit-20260927]
    paths: [.github/workflows/audit-invalidation-resume.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITEST_MAX_WORKERS: "1"
      CI: "1"
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b5aaf3c300a0bb530adbb777f73bef006d86215b
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Execute full unit suite
        run: |
          mkdir -p artifacts/invalidation-audit
          pnpm exec vitest run --reporter=json --outputFile=artifacts/preview-unit.json
      - name: Repeat paired timings without test-worker contention
        run: |
          for run in 1 2 3; do
            for benchmark in scripts/benchmark-invalidation*.mjs; do
              node "$benchmark" > "artifacts/invalidation-audit/$(basename "$benchmark" .mjs)-node-${{ matrix.node-version }}-${run}.json"
            done
          done
      - name: Run both browser suites and capture raw evidence
        if: matrix.node-version == 22
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --reporter=json > artifacts/preview-browser.json
          pnpm exec playwright test --config playwright.site.config.ts --reporter=json > artifacts/audit-site-browser.json
          node scripts/performance-smoke.mjs > artifacts/preview-node-smoke.json
      - name: Record only freshly executed results
        if: matrix.node-version == 22
        run: |
          node scripts/record-preview-evidence.mjs
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for name in ['protocol-motion', 'interaction-performance', 'chromium-reference']:
              path = Path('conformance/results/' + name + '-2026-09-26.json')
              if not path.exists():
                  if name == 'chromium-reference':
                      path = Path('conformance/results/chromium-reference-2026-08-14.json')
                  else:
                      raise ValueError('Missing freshly executed result: ' + str(path))
              result = json.loads(path.read_text())
              if 'rawReport' in result:
                  result['rawReport']['artifact'] = 'invalidation-audit-node-22'
              if name == 'protocol-motion':
                  for source in ['packages/geometry/test/invalidation-differential.test.ts', 'packages/geometry/test/reference-invalidation.ts', 'packages/geometry/test/reference/invalidation.ts', 'packages/geometry/test/invalidation.test.ts']:
                      result['sourceDigests'][source] = hashlib.sha256(Path(source).read_bytes()).hexdigest()
                  result['sourceDigests'] = dict(sorted(result['sourceDigests'].items()))
              path.write_text(json.dumps(result, indent=2) + '\n')
          PY
          pnpm exec oxfmt --write conformance/results
          node scripts/generate-conformance-data.mjs
          git add conformance docs/CONFORMANCE.md
          git -c user.name='Performance audit' -c user.email='audit@users.noreply.github.com' commit -m 'test: record this executed browser and unit evidence'
          git diff --binary b5aaf3c300a0bb530adbb777f73bef006d86215b HEAD > artifacts/invalidation-evidence.patch
          git rev-parse HEAD^{tree} > artifacts/invalidation-evidence-tree.txt
      - name: Verify complete candidate plus recorded evidence
        if: matrix.node-version == 22
        run: pnpm check
      - name: Retain inspectable benchmark batches and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: invalidation-audit-node-${{ matrix.node-version }}
          path: |
            artifacts
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 30

  publish-executed-evidence:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b5aaf3c300a0bb530adbb777f73bef006d86215b
      - uses: actions/download-artifact@v7
        with:
          name: invalidation-audit-node-22
          path: /tmp/verified-evidence
      - name: Publish only the exact checked result tree
        shell: bash
        run: |
          branch=perf/audit-invalidation-20260927
          git fetch --no-tags origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = b5aaf3c300a0bb530adbb777f73bef006d86215b
          git switch -c "$branch"
          git apply --check /tmp/verified-evidence/artifacts/invalidation-evidence.patch
          git apply --index /tmp/verified-evidence/artifacts/invalidation-evidence.patch
          test "$(git write-tree)" = "$(cat /tmp/verified-evidence/artifacts/invalidation-evidence-tree.txt)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(geometry): record passing browser and unit evidence for invalidation'
          git push origin "HEAD:refs/heads/$branch"
