name: Playground feature audit
on:
  pull_request:
    paths:
      - "apps/demo/**"
      - "packages/**"
      - "audit-e2e/**"
      - "playwright.audit.config.ts"
      - ".github/workflows/playground-audit.yml"
permissions:
  contents: read
jobs:
  features:
    runs-on: ubuntu-latest
    container:
      # Keep this image aligned with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, phone-chromium, phone-webkit, desktop-firefox]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise all playground controls on ${{ matrix.project }}
        run: |
          mkdir -p artifacts
          pnpm exec playwright test --config playwright.audit.config.ts --project="${{ matrix.project }}" --workers=2 --retries=0 --reporter=json --output=artifacts/audit-results > artifacts/playground-audit.json
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz HEAD -o artifacts/audit-source.tar.gz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playground-feature-audit-${{ matrix.project }}
          path: artifacts
          retention-days: 30

  hosted:
    needs: features
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      # Keep this image aligned with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, phone-chromium, phone-webkit, desktop-firefox]
    env:
      PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the deployed revision, then audit the public playground
        run: |
          mkdir -p artifacts
          node scripts/verify-playground-preview.mjs
          PANEFOLD_AUDIT_URL="https://natanelia.github.io/panefold/previews/pr-${PREVIEW_NUMBER}/workbench/site/workbench/" pnpm exec playwright test --config playwright.audit.config.ts --project="${{ matrix.project }}" --workers=2 --retries=0 --reporter=json --output=artifacts/hosted-results > artifacts/hosted-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playground-hosted-audit-${{ matrix.project }}
          path: artifacts
          retention-days: 30
