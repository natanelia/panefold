name: Verify direct touch workspace
on:
  push:
    branches: [docs/developer-first-site]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'natanelia/panefold' && github.ref == 'refs/heads/docs/developer-first-site'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      VITEST_MAX_WORKERS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply the reviewed touch patch and remove this temporary runner
        env:
          TOUCH_PATCH: 
        run: |
          printf '%s' "$TOUCH_PATCH" | base64 --decode | gzip --decompress > /tmp/touch.patch
          echo '213fbd82849789102ab89814b459a80ce3ff1a4903154fa7ad764e5242a2c904  /tmp/touch.patch' | sha256sum --check
          git apply --check /tmp/touch.patch
          git apply /tmp/touch.patch
          rm .github/workflows/touch-workspace.yml
          mkdir -p artifacts
          cp /tmp/touch.patch artifacts/reviewed-touch.patch
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test direct touch and mobile behavior without retries
        run: pnpm exec playwright test e2e/touch-layout.spec.ts e2e/mobile-playground.spec.ts --workers=2 --retries=0 --reporter=json --output=artifacts/touch-results > artifacts/touch-browser.json
      - name: Run all unit and application tests
        run: |
          pnpm build:packages
          pnpm exec vitest run --reporter=json --outputFile=artifacts/preview-unit.json
          pnpm --filter @panefold/demo test
          pnpm --filter @panefold/site test
      - name: Run the full reference browser suite without retries
        run: pnpm exec playwright test --workers=2 --retries=0 --reporter=json > artifacts/preview-browser.json
      - name: Run the website and embedded touch suite
        run: pnpm exec playwright test --config playwright.site.config.ts --workers=2 --retries=0 --reporter=json --output=artifacts/site-results > artifacts/site-browser.json
      - name: Record only freshly executed evidence
        run: |
          pnpm performance:smoke > artifacts/preview-node-smoke.json
          node scripts/record-preview-evidence.mjs
          pnpm exec oxfmt conformance/results docs/CONFORMANCE.md
          pnpm conformance:data:generate
          git add -A
      - name: Run all repository checks on the staged candidate
        run: |
          node --test scripts/pages-*.test.mjs scripts/site-catalog.test.mjs
          pnpm check
      - name: Preserve the tested candidate as immutable Git objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, writeFile } from 'node:fs/promises';
          const repo = process.env.GITHUB_REPOSITORY;
          const parent = process.env.GITHUB_SHA;
          const call = async (route, body) => {
            const response = await fetch(`https://api.github.com/repos/${repo}/git/${route}`, {
              method: body === undefined ? 'GET' : 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
            });
            if (!response.ok) throw new Error(`Git object request failed: ${response.status} ${route}`);
            return response.json();
          };
          const base = await call(`commits/${parent}`);
          const paths = execFileSync('git', ['diff', '--cached', '--name-only', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const tree = [];
          for (const path of paths) {
            const entry = execFileSync('git', ['ls-files', '--stage', '--', path], { encoding: 'utf8' });
            if (!entry) { tree.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
            const blob = await call('blobs', { content: (await readFile(path)).toString('base64'), encoding: 'base64' });
            tree.push({ path, mode: entry.slice(0, 6), type: 'blob', sha: blob.sha });
          }
          const createdTree = await call('trees', { base_tree: base.tree.sha, tree });
          const commit = await call('commits', {
            message: 'fix: retain direct touch docking, nested splits and resizing on mobile',
            tree: createdTree.sha, parents: [parent],
          });
          await writeFile('artifacts/tested-candidate.json', JSON.stringify({ parent, commit: commit.sha, tree: createdTree.sha, files: tree }, null, 2));
          console.log(`TESTED_CANDIDATE_COMMIT=${commit.sha}`);
          NODE
      - name: Preserve test results traces and reviewed patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-executed-evidence
          path: |
            artifacts
            test-results
          retention-days: 30
