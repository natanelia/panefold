name: Linked context final check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'feat/linked-panel-context'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_WORKERS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p artifacts
      - run: pnpm format:check
      - run: pnpm build:packages
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Execute full unit suite
        run: pnpm exec vitest run --reporter=json --outputFile=artifacts/preview-unit.json
      - name: Execute Node performance measurements
        run: node scripts/performance-smoke.mjs > artifacts/preview-node-smoke.json
      - run: pnpm exec playwright install --with-deps chromium
      - name: Execute full reference browser suite
        run: pnpm exec playwright test --reporter=json > artifacts/preview-browser.json
      - name: Record fresh results and verify their source provenance
        run: |
          node scripts/record-preview-evidence.mjs
          pnpm exec oxfmt --write docs/CONFORMANCE.md
          pnpm conformance:data:generate
          pnpm conformance:check 2>&1 | tee artifacts/conformance-check.log
          git log -1 --format='%H %P' > artifacts/commit.txt
          git diff --name-only > artifacts/changed-files.txt
          git diff -- conformance docs/CONFORMANCE.md > artifacts/evidence.patch
          tar -czf artifacts/generated-evidence.tar.gz conformance docs/CONFORMANCE.md
      - run: pnpm build:site
      - name: Execute site browser suite
        run: pnpm exec playwright test --config playwright.site.config.ts --reporter=json > artifacts/preview-site-browser.json
      - name: Preserve fresh execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-executed-evidence
          path: artifacts
          if-no-files-found: error
          retention-days: 30
