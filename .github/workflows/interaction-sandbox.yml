name: Validate and record drag interaction parity

on:
  push:
    branches: [fix/vscode-drag-interaction-parity]
    paths: [.github/workflows/interaction-sandbox.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed source changes and remove transport files
        id: prepare
        env:
          START_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          parts = sorted(pathlib.Path('.github').glob('interaction-patch.*.b64'))
          assert len(parts) == 5
          data = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(data).hexdigest() == '54c1e4ac39eb9b5fbe6dd338d1bcaaed3120ba2c88b29935e978f583c830bad6'
          pathlib.Path('/tmp/interactions.patch').write_bytes(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin bd2a43d80a8fd036414bf42d511295d8d3906ca0
          git cherry-pick --no-commit bd2a43d80a8fd036414bf42d511295d8d3906ca0
          git apply --unidiff-zero --index /tmp/interactions.patch
          git rm .github/interaction-patch.*.b64 .github/workflows/interaction-sandbox.yml
          git commit -m 'feat(react): refine VS Code drag interactions, indexed tabs and group merging'
          git branch prepared-interactions
          git bundle create /tmp/interaction-code.bundle "$START_SHA"..prepared-interactions
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: interaction-code-bundle
          path: /tmp/interaction-code.bundle
          retention-days: 2
          if-no-files-found: error

  publish-code:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: /tmp/code
          merge-multiple: true
      - name: Fast-forward only the requested feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git -c core.hooksPath=/dev/null fetch /tmp/code/interaction-code.bundle refs/heads/prepared-interactions
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin FETCH_HEAD:refs/heads/fix/vscode-drag-interaction-parity

  validate:
    needs: [prepare, publish-code]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.bundle.outputs.sha }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install video encoder
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pnpm build:packages
      - name: Full unit suite with retained JSON
        id: units
        continue-on-error: true
        run: |
          mkdir -p artifacts
          pnpm exec vitest run --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile=artifacts/preview-unit.json
      - name: Full Chromium suite with retained JSON
        id: browser
        continue-on-error: true
        run: pnpm exec playwright test --retries=0 --reporter=json > artifacts/preview-browser.json
      - name: Capture identical gestures against the pinned main baseline
        id: capture
        continue-on-error: true
        run: |
          git worktree add --detach /tmp/panefold-before 877be5f4ee9aae5f76e0a72e2b05b3725b4eacbc
          pnpm --dir /tmp/panefold-before install --frozen-lockfile
          node scripts/capture-drag-comparison.mjs --before-dir /tmp/panefold-before
      - name: Require all executed scenarios to pass
        env:
          UNIT_OUTCOME: ${{ steps.units.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          test "$UNIT_OUTCOME" = success
          test "$BROWSER_OUTCOME" = success
          test "$CAPTURE_OUTCOME" = success
      - name: Record fresh source-bound conformance evidence
        run: |
          node scripts/performance-smoke.mjs > artifacts/preview-node-smoke.json
          node scripts/record-preview-evidence.mjs
          pnpm exec oxfmt --write conformance/results/*-2026-09-26.json docs/media/vscode-drag-provenance.json
          node scripts/generate-conformance-data.mjs
          git add conformance docs/media
      - name: Repository and demo verification
        run: |
          pnpm check
          pnpm --filter @panefold/demo test
          pnpm test:site:e2e
      - name: Commit executed evidence and recordings
        id: bundle
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conformance docs/media
          git commit -m 'test: retain executed drag parity evidence and before-after GIFs'
          git branch captured-interactions
          git bundle create /tmp/interaction-evidence.bundle "$SOURCE_SHA"..captured-interactions
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: interaction-evidence-bundle
          path: /tmp/interaction-evidence.bundle
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-executed-evidence
          path: |
            artifacts
            test-results
            docs/media/vscode-drag-*
          retention-days: 30
          if-no-files-found: warn

  publish-evidence:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vscode-drag-interaction-parity
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact }}
          path: /tmp/evidence
          merge-multiple: true
      - name: Fast-forward only the requested feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          git -c core.hooksPath=/dev/null fetch /tmp/evidence/interaction-evidence.bundle refs/heads/captured-interactions
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin FETCH_HEAD:refs/heads/fix/vscode-drag-interaction-parity
