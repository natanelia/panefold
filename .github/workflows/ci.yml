name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Preserve Node performance evidence
        run: |
          mkdir -p artifacts
          pnpm performance:smoke > "artifacts/performance-smoke-node-${{ matrix.node-version }}.json"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence-node-${{ matrix.node-version }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:site:e2e
      - name: Upload browser evidence and retained traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 30
