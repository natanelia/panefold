name: Apply reviewed playground fixes
on:
  push:
    branches: [audit/pr47-feature-fixes]
    paths: [.audit-transfer/**, .github/workflows/audit-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and apply the exact reviewed patch
        run: |
          test "$GITHUB_REF" = refs/heads/audit/pr47-feature-fixes
          echo '8d692ab6b98898e27b8bfeb8b93baac3d1cd9c19b54a6c3f52c83014449cf51e  .audit-transfer/update.patch' | sha256sum --check
          git apply --check .audit-transfer/update.patch
          git apply --index .audit-transfer/update.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(playground): preserve one-step docking history and isolate floating keyboard controls'
          git push origin HEAD:refs/heads/audit/pr47-feature-fixes
